<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Wedding — Vowza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
</head>
<body style="visibility:hidden;">
  <header class="site">
    <div class="wrap">
      <a class="wordmark" href="index.html">Vowza</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="supplier-list.html">Discover</a>
        <a href="my-wedding.html" class="active">My Wedding</a>
        <a href="shortlist.html">Saved</a>
        <a href="couple-profile.html">Profile</a>
        <a href="#" id="logoutLink">Log Out</a>
      </nav>
    </div>
  </header>

  <section class="page-head wrap">
    <h1>My Wedding</h1>
    <p id="weddingSummary">Loading…</p>
  </section>

  <div class="wrap" style="padding-bottom:20px;">
    <div id="weddingRows">
      <p style="text-align:center; color:var(--ink-soft); padding:20px 0;">Loading…</p>
    </div>
  </div>

  <div class="wrap" style="padding-bottom:60px; text-align:center;">
    <a class="btn primary" href="supplier-list.html">Find another supplier</a>
  </div>

  <footer>
    Vowza — Less emailing. More celebrating.
  </footer>

  <script>
    // This is a DISPLAY lookup table, not fake data — the actual status
    // for each booking comes from the real "status" column in the
    // database (see bookings.status below). This function only decides
    // how to SHOW each of the 4 possible fixed values (color, icon,
    // wording) — the same way a traffic light's colors always mean the
    // same thing, without that being "hardcoded data" about any
    // particular car's real position.
    function statusBadge(status) {
      var map = {
        pending: ['status-badge pending', '🟡 Awaiting response'],
        accepted: ['status-badge accepted', '🟢 Accepted'],
        confirmed: ['status-badge confirmed', '🟢 Booked'],
        declined: ['status-badge declined', '🔴 Declined']
      };
      var s = map[status] || ['status-badge', status];
      return '<span class="' + s[0] + '">' + s[1] + '</span>';
    }

    // AUTH GUARD: this is personal data, so require login
    (async function () {
      var userResult = await supabaseClient.auth.getUser();
      if (!userResult.data.user) {
        window.location.href = 'login.html';
        return;
      }
      var userId = userResult.data.user.id;

      // maybeSingle() (not single()) is used here deliberately — a
      // brand-new couple might not have completed Wedding Setup yet,
      // meaning zero rows exist. single() would treat that as an
      // error; maybeSingle() just returns null and we show defaults.
      var profileResult = await supabaseClient
        .from('wedding_profiles')
        .select('*')
        .eq('user_id', userId)
        .maybeSingle();

      document.body.style.visibility = 'visible';
      var summaryEl = document.getElementById('weddingSummary');

      if (!profileResult.error && profileResult.data) {
        var profile = profileResult.data;
        var parts = [];
        if (profile.wedding_date) {
          parts.push(new Date(profile.wedding_date + 'T00:00:00').toLocaleDateString('en-AU', {
            day: 'numeric', month: 'long', year: 'numeric'
          }));
        }
        if (profile.location) parts.push(profile.location);

        if (parts.length > 0) {
          summaryEl.textContent = parts.join(' · ');
        } else {
          // A profile row exists but date/location weren't filled in
          summaryEl.innerHTML = 'No wedding details yet — <a href="couple-profile.html" style="color:var(--evergreen); font-weight:500;">add them here</a>.';
        }
      } else {
        // No profile row at all yet — this couple hasn't done Wedding Setup
        summaryEl.innerHTML = 'You haven\'t set up your wedding yet — <a href="wedding-setup.html" style="color:var(--evergreen); font-weight:500;">start here</a>.';
      }

      // Fetch real bookings, saved suppliers, AND this account's own
      // reviews (so we know which confirmed bookings already have one)
      var bookingsResult = await supabaseClient
        .from('bookings')
        .select('*')
        .eq('user_id', userId)
        .order('created_at', { ascending: false });

      var savedResult = await supabaseClient
        .from('saved_suppliers')
        .select('*')
        .eq('user_id', userId)
        .order('created_at', { ascending: false });

      var reviewsResult = await supabaseClient
        .from('reviews')
        .select('booking_id')
        .eq('user_id', userId);

      var bookings = (bookingsResult.data || []);
      var saved = (savedResult.data || []);
      var reviewedBookingIds = (reviewsResult.data || []).map(function (r) { return r.booking_id; });

      // Don't show a supplier as "just saved" if they've also been
      // booked — the booking row already covers them
      var bookedNames = bookings.map(function (b) { return b.supplier_name; });
      var savedOnly = saved.filter(function (s) { return bookedNames.indexOf(s.supplier_name) === -1; });

      var rowsHtml = '';

      bookings.forEach(function (b) {
        var reviewBlock = '';
        if (b.status === 'confirmed') {
          if (reviewedBookingIds.indexOf(b.id) !== -1) {
            reviewBlock = '<span style="font-size:13px; color:var(--ink-soft);">✓ Reviewed</span>';
          } else {
            reviewBlock = '<button type="button" class="btn ghost small review-btn" data-booking-id="' + b.id + '" data-supplier-slug="' + (b.supplier_slug || '') + '" data-supplier-name="' + (b.supplier_name || '').replace(/"/g, '&quot;') + '">Leave a Review</button>';
          }
        }
        var supplierLink = b.supplier_slug
          ? '<a href="supplier-profile.html?slug=' + encodeURIComponent(b.supplier_slug) + '" style="color:var(--evergreen); font-weight:500;">' + (b.supplier_name || '') + '</a>'
          : (b.supplier_name || '');
        rowsHtml += '<div class="list-row" data-row-for="' + b.id + '"><div class="info"><h3>' + (b.category || '') + '</h3><p>' +
          supplierLink + (b.package_name ? ' — ' + b.package_name : '') + '</p></div>' +
          '<div class="actions" style="align-items:center;">' + statusBadge(b.status) + reviewBlock + '</div></div>';
      });

      savedOnly.forEach(function (s) {
        var savedLink = s.supplier_slug
          ? '<a href="supplier-profile.html?slug=' + encodeURIComponent(s.supplier_slug) + '" style="color:var(--evergreen); font-weight:500;">' + (s.supplier_name || '') + '</a>'
          : (s.supplier_name || '');
        rowsHtml += '<div class="list-row"><div class="info"><h3>' + (s.category || '') + '</h3><p>' +
          savedLink + '</p></div><span class="status-badge saved">❤ Saved</span></div>';
      });

      var container = document.getElementById('weddingRows');
      if (rowsHtml === '') {
        container.innerHTML = '<div class="empty-state"><h3>Nothing saved or booked yet</h3><p>Browse suppliers to save your favourites or send a booking request.</p></div>';
      } else {
        container.innerHTML = rowsHtml;
      }

      // ============================================
      // LEAVE A REVIEW: clicking the button swaps it for an inline
      // star-rating + comment form. This works via event delegation
      // (one listener on the container) since these rows were just
      // built dynamically above.
      // ============================================
      container.addEventListener('click', function (e) {
        var btn = e.target.closest('.review-btn');
        if (!btn) return;

        var row = btn.closest('.list-row');
        var formId = 'reviewForm-' + btn.dataset.bookingId;

        row.insertAdjacentHTML('afterend',
          '<div class="list-row" id="' + formId + '" style="display:block;">' +
          '<div class="field" style="margin-bottom:10px;">' +
            '<label>Rating</label>' +
            '<select class="review-rating">' +
              '<option value="5">★★★★★ (5)</option>' +
              '<option value="4">★★★★☆ (4)</option>' +
              '<option value="3">★★★☆☆ (3)</option>' +
              '<option value="2">★★☆☆☆ (2)</option>' +
              '<option value="1">★☆☆☆☆ (1)</option>' +
            '</select>' +
          '</div>' +
          '<div class="field" style="margin-bottom:10px;">' +
            '<label>Your review</label>' +
            '<textarea class="review-comment" placeholder="How did it go with ' + btn.dataset.supplierName + '?"></textarea>' +
          '</div>' +
          '<button type="button" class="btn primary small submit-review-btn" data-booking-id="' + btn.dataset.bookingId + '" data-supplier-slug="' + btn.dataset.supplierSlug + '" data-supplier-name="' + btn.dataset.supplierName + '">Submit Review</button>' +
          '</div>'
        );
        btn.remove(); // hide the original "Leave a Review" button while the form is open
      });

      container.addEventListener('click', async function (e) {
        var submitBtn = e.target.closest('.submit-review-btn');
        if (!submitBtn) return;

        var formRow = submitBtn.closest('.list-row');
        var rating = formRow.querySelector('.review-rating').value;
        var comment = formRow.querySelector('.review-comment').value;

        submitBtn.disabled = true;
        var result = await supabaseClient.from('reviews').insert({
          booking_id: submitBtn.dataset.bookingId,
          user_id: userId,
          supplier_slug: submitBtn.dataset.supplierSlug,
          supplier_name: submitBtn.dataset.supplierName,
          rating: parseInt(rating, 10),
          comment: comment,
          reviewer_name: (profileResult.data && profileResult.data.couple_name) || 'Verified booking'
        });

        if (result.error) {
          submitBtn.disabled = false;
          alert('Could not submit review: ' + result.error.message);
          return;
        }

        formRow.outerHTML = '<div class="list-row"><span style="font-size:13px; color:var(--evergreen);">✓ Thanks for your review!</span></div>';
      });
    })();

    document.getElementById('logoutLink').addEventListener('click', async function (e) {
      e.preventDefault();
      await supabaseClient.auth.signOut();
      window.location.href = 'index.html';
    });
  </script>

</body>
</html>
