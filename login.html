<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Vowza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
</head>
<body>
  <header class="site">
    <div class="wrap" style="justify-content:center;">
      <a class="wordmark" href="index.html">Vowza</a>
    </div>
  </header>

  <section class="page-head wrap" style="text-align:center;">
    <h1>Log In</h1>
    <p>Works for couples, suppliers, and admin — same login, different home page.</p>
  </section>

  <div class="wrap" style="padding-bottom:60px;">
    <form class="form-card" id="loginForm">
      <div class="field">
        <label>Email</label>
        <input type="email" id="loginEmail" required>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="loginPassword" required>
      </div>
      <button type="submit" class="btn primary full">Log In</button>
      <p id="loginError" style="text-align:center; color:var(--red); font-size:13px; margin-top:12px; display:none;"></p>
    </form>
    <p style="text-align:center; margin-top:20px; font-size:14px;">
      Don't have an account? <a href="start.html" style="color:var(--evergreen); font-weight:500;">Get started</a>
    </p>
  </div>

  <footer>
    Vowza — Less emailing. More celebrating.
  </footer>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      var errorMsg = document.getElementById('loginError');
      errorMsg.style.display = 'none';

      var result = await supabaseClient.auth.signInWithPassword({
        email: document.getElementById('loginEmail').value,
        password: document.getElementById('loginPassword').value
      });

      if (result.error) {
        errorMsg.textContent = result.error.message;
        errorMsg.style.display = 'block';
        return;
      }

      // One login, three possible destinations. app_metadata (admin
      // flag) is checked first since it's the one that actually
      // matters for security; user_metadata.role just decides which
      // "normal" home page to send someone to.
      var user = result.data.user;
      var isAdmin = user.app_metadata && user.app_metadata.role === 'admin';
      var role = user.user_metadata && user.user_metadata.role;

      if (isAdmin) {
        window.location.href = 'admin-dashboard.html';
      } else if (role === 'supplier') {
        window.location.href = 'supplier-dashboard.html';
      } else {
        window.location.href = 'my-wedding.html';
      }
    });
  </script>

</body>
</html>
