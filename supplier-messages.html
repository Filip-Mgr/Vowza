<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages — Vowza for Suppliers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  .convo-list { display: grid; grid-template-columns: 260px 1fr; gap: 0; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: #fff; min-height: 420px; }
  .convo-sidebar { border-right: 1px solid var(--border); }
  .convo-item { display: block; padding: 16px 18px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .convo-item:hover, .convo-item.active { background: var(--ivory); }
  .convo-item h4 { font-family: 'Cormorant Garamond', serif; font-size: 16px; margin: 0 0 4px; }
  .convo-item p { font-size: 12px; color: var(--ink-soft); margin: 0; }
  .convo-thread { display: flex; flex-direction: column; height: 100%; }
  .thread-messages { flex: 1; padding: 20px; overflow-y: auto; max-height: 420px; }
  .msg-bubble { max-width: 70%; padding: 10px 14px; border-radius: 10px; margin-bottom: 10px; font-size: 14px; line-height: 1.4; }
  .msg-bubble.mine { background: var(--evergreen); color: #fff; margin-left: auto; }
  .msg-bubble.theirs { background: var(--ivory); border: 1px solid var(--border); }
  .msg-time { font-size: 11px; color: var(--ink-soft); margin-top: 3px; }
  .thread-input { display: flex; gap: 10px; padding: 14px; border-top: 1px solid var(--border); }
  .thread-input textarea { flex: 1; resize: none; border: 1px solid var(--border); border-radius: 6px; padding: 10px; font-family: inherit; font-size: 14px; }
  @media (max-width: 700px) { .convo-list { grid-template-columns: 1fr; } .convo-sidebar { display: none; } }
</style>
</head>
<body style="visibility:hidden;">
  <header class="site">
    <div class="wrap">
      <a class="wordmark" href="supplier-dashboard.html">Vowza <span style="font-size:12px; color:var(--ink-soft); font-family:'Work Sans',sans-serif; font-weight:400;">for Suppliers</span></a>
      <nav>
        <a href="supplier-dashboard.html">Dashboard</a>
        <a href="supplier-enquiries.html">Enquiries</a>
        <a href="supplier-availability.html">Calendar</a>
        <a href="supplier-bookings.html">Bookings</a>
        <a href="supplier-messages.html" class="active">Messages</a>
        <a href="#" id="logoutLink">Log Out</a>
      </nav>
    </div>
  </header>

  <section class="page-head wrap">
    <h1>Messages</h1>
  </section>

  <div class="wrap" style="padding-bottom:60px;">
    <div id="messagesArea">
      <p style="text-align:center; color:var(--ink-soft); padding:40px 0;">Loading…</p>
    </div>
  </div>

  <footer>
    Vowza — Less emailing. More celebrating.
  </footer>

  <script>
    function escapeHtml(str) {
      var div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    function timeAgo(dateStr) {
      var diff = (Date.now() - new Date(dateStr).getTime()) / 1000;
      if (diff < 3600) return Math.max(1, Math.floor(diff / 60)) + 'm ago';
      if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
      return Math.floor(diff / 86400) + 'd ago';
    }

    var mySupplierId = null;
    var conversations = []; // [{ coupleUserId, coupleName, messages: [...] }]
    var activeCoupleId = null;

    async function loadConversations() {
      var msgResult = await supabaseClient
        .from('messages')
        .select('*')
        .eq('supplier_id', mySupplierId)
        .order('created_at', { ascending: true });

      var messages = msgResult.data || [];

      var byCouple = {};
      messages.forEach(function (m) {
        if (!byCouple[m.couple_user_id]) byCouple[m.couple_user_id] = [];
        byCouple[m.couple_user_id].push(m);
      });

      var coupleIds = Object.keys(byCouple);

      if (coupleIds.length === 0) {
        document.getElementById('messagesArea').innerHTML =
          '<div class="empty-state"><h3>No messages yet</h3><p>Couples will appear here once they message you about a booking.</p></div>';
        return;
      }

      // Look up each couple's name from their wedding profile, so
      // suppliers see "Sasha & Filip" instead of a bare user ID
      var profilesResult = await supabaseClient
        .from('wedding_profiles')
        .select('user_id, couple_name, email')
        .in('user_id', coupleIds);

      var nameById = {};
      (profilesResult.data || []).forEach(function (p) {
        nameById[p.user_id] = p.couple_name || p.email || 'A couple';
      });

      conversations = coupleIds.map(function (id) {
        return { coupleUserId: id, coupleName: nameById[id] || 'A couple', messages: byCouple[id] };
      }).sort(function (a, b) {
        var aLast = a.messages[a.messages.length - 1].created_at;
        var bLast = b.messages[b.messages.length - 1].created_at;
        return bLast.localeCompare(aLast);
      });

      if (!activeCoupleId) activeCoupleId = conversations[0].coupleUserId;
      renderConversations();
    }

    function renderConversations() {
      var sidebarHtml = conversations.map(function (c) {
        var last = c.messages[c.messages.length - 1];
        var activeClass = c.coupleUserId === activeCoupleId ? ' active' : '';
        return '<div class="convo-item' + activeClass + '" data-couple-id="' + c.coupleUserId + '">' +
          '<h4>' + escapeHtml(c.coupleName) + '</h4>' +
          '<p>' + escapeHtml(last.body) + '</p>' +
          '<p style="margin-top:4px;">' + timeAgo(last.created_at) + '</p>' +
          '</div>';
      }).join('');

      var active = conversations.find(function (c) { return c.coupleUserId === activeCoupleId; });
      var messagesHtml = active.messages.map(function (m) {
        var mine = m.sender_role === 'supplier';
        return '<div class="msg-bubble ' + (mine ? 'mine' : 'theirs') + '">' + escapeHtml(m.body) +
          '<div class="msg-time">' + timeAgo(m.created_at) + '</div></div>';
      }).join('');

      document.getElementById('messagesArea').innerHTML =
        '<div class="convo-list">' +
          '<div class="convo-sidebar">' + sidebarHtml + '</div>' +
          '<div class="convo-thread">' +
            '<div class="thread-messages" id="threadMessages">' + messagesHtml + '</div>' +
            '<div class="thread-input">' +
              '<textarea id="messageInput" rows="1" placeholder="Reply…"></textarea>' +
              '<button type="button" class="btn primary small" id="sendBtn">Send</button>' +
            '</div>' +
          '</div>' +
        '</div>';

      var threadEl = document.getElementById('threadMessages');
      threadEl.scrollTop = threadEl.scrollHeight;
    }

    document.getElementById('messagesArea').addEventListener('click', function (e) {
      var item = e.target.closest('.convo-item');
      if (!item) return;
      activeCoupleId = item.dataset.coupleId;
      renderConversations();
    });

    document.getElementById('messagesArea').addEventListener('click', async function (e) {
      if (e.target.id !== 'sendBtn') return;
      var input = document.getElementById('messageInput');
      var body = input.value.trim();
      if (!body) return;

      var active = conversations.find(function (c) { return c.coupleUserId === activeCoupleId; });

      var result = await supabaseClient.from('messages').insert({
        couple_user_id: activeCoupleId,
        supplier_id: mySupplierId,
        sender_role: 'supplier',
        body: body
      });

      if (result.error) {
        alert('Could not send: ' + result.error.message);
        return;
      }

      input.value = '';
      await loadConversations();
    });

    // ============================================
    // AUTH GUARD: must be logged in AND actually own a supplier
    // profile (i.e. have completed supplier-onboarding.html) —
    // otherwise there's no "supplier_id" for this account to see
    // any messages through.
    // ============================================
    (async function () {
      var userResult = await supabaseClient.auth.getUser();
      if (!userResult.data.user) {
        window.location.href = 'login.html';
        return;
      }

      var supplierResult = await supabaseClient
        .from('suppliers')
        .select('id')
        .eq('user_id', userResult.data.user.id)
        .maybeSingle();

      if (!supplierResult.data) {
        document.body.style.visibility = 'visible';
        document.getElementById('messagesArea').innerHTML =
          '<div class="empty-state"><h3>No supplier profile found</h3><p>Complete <a href="supplier-onboarding.html" style="color:var(--evergreen); font-weight:500;">supplier onboarding</a> first to receive messages from couples.</p></div>';
        return;
      }

      mySupplierId = supplierResult.data.id;
      document.body.style.visibility = 'visible';
      await loadConversations();
    })();

    document.getElementById('logoutLink').addEventListener('click', async function (e) {
      e.preventDefault();
      await supabaseClient.auth.signOut();
      window.location.href = 'index.html';
    });
  </script>

</body>
</html>
