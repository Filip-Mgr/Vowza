<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vowza — Get Started</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site">
    <div class="wrap" style="justify-content:center;">
      <a class="wordmark" href="index.html">Vowza</a>
    </div>
  </header>

  <section class="page-head wrap" style="text-align:center; padding-top:60px;">
    <h1 style="font-size:44px;">Vowza</h1>
    <p>Tell us who you are to get started.</p>
  </section>

  <div class="wrap" style="padding-bottom:30px;">
    <div class="auth-choice">
      <a href="signup.html?role=couple">
        <div class="icon">💍</div>
        <h3>Bride / Groom</h3>
        <p>Find and book wedding suppliers</p>
      </a>
      <a href="signup.html?role=supplier">
        <div class="icon">💼</div>
        <h3>Supplier</h3>
        <p>Showcase your business and get booked</p>
      </a>
    </div>
    <p style="text-align:center; margin-top:30px; font-size:14px;">
      Already have an account? <a href="login.html" style="color:var(--evergreen); font-weight:500;">Log in</a>
    </p>
  </div>

  <footer>
    Vowza — Less emailing. More celebrating.
  </footer>

</body>
</html>
