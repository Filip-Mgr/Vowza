<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Setup — Vowza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site">
    <div class="wrap" style="justify-content:center;">
      <a class="wordmark" href="index.html">Vowza</a>
    </div>
  </header>

  <section class="page-head wrap" style="text-align:center;">
    <h1>Tell us about your wedding</h1>
    <p>This helps us match you with the right suppliers.</p>
  </section>

  <div class="wrap" style="padding-bottom:60px;">
    <form class="form-card">
      <div class="field">
        <label>What's your wedding date?</label>
        <input type="date">
      </div>
      <div class="field">
        <label>Where are you getting married?</label>
        <input type="text" placeholder="e.g. Melbourne, VIC">
      </div>
      <div class="field">
        <label>How many guests are you expecting?</label>
        <input type="number" placeholder="e.g. 90">
      </div>
      <div class="field">
        <label>What's your approximate wedding budget?</label>
        <input type="text" placeholder="e.g. $35,000">
      </div>
      <div class="field">
        <label>What suppliers are you looking for?</label>
        <div class="checkbox-grid">
          <label><input type="checkbox"> Hair &amp; Makeup</label>
          <label><input type="checkbox"> Photography</label>
          <label><input type="checkbox"> Videography</label>
          <label><input type="checkbox"> Florist</label>
          <label><input type="checkbox"> DJ</label>
          <label><input type="checkbox"> Music</label>
          <label><input type="checkbox"> Celebrant</label>
          <label><input type="checkbox"> Cake</label>
          <label><input type="checkbox"> Styling &amp; Décor</label>
          <label><input type="checkbox"> Wedding Cars</label>
          <label><input type="checkbox"> Content Creator</label>
          <label><input type="checkbox"> Wedding Planner</label>
        </div>
      </div>
      <a class="btn primary full" href="supplier-list.html">Continue</a>
    </form>
  </div>

  <footer>
    Vowza — Less emailing. More celebrating.
  </footer>

</body>
</html>
