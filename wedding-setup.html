<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Setup — Vowza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<!-- The Supabase library itself, then our shared connection setup -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
</head>
<body style="visibility:hidden;">
  <header class="site">
    <div class="wrap" style="justify-content:center;">
      <a class="wordmark" href="index.html">Vowza</a>
    </div>
  </header>

  <section class="page-head wrap" style="text-align:center;">
    <h1>Tell us about your wedding</h1>
    <p>This helps us match you with the right suppliers.</p>
  </section>

  <div class="wrap" style="padding-bottom:60px;">
    <!-- The form now has an id so our JavaScript below can find it,
         and every field that needs to be saved has its own id too. -->
    <form class="form-card" id="weddingForm">
      <div class="field">
        <label>What's your wedding date?</label>
        <input type="date" id="weddingDate">
      </div>
      <div class="field">
        <label>Where are you getting married?</label>
        <input type="text" id="weddingLocation" placeholder="e.g. Melbourne, VIC">
      </div>
      <div class="field">
        <label>How many guests are you expecting?</label>
        <input type="number" id="guestCount" placeholder="e.g. 90">
      </div>
      <div class="field">
        <label>What's your approximate wedding budget?</label>
        <input type="text" id="weddingBudget" placeholder="e.g. $35,000">
      </div>
      <div class="field">
        <label>What suppliers are you looking for?</label>
        <!-- Every checkbox shares name="category" (so JavaScript can find
             them all at once) and has a "value" matching its label text
             exactly — that's what gets saved and matched up later. -->
        <div class="checkbox-grid">
          <label><input type="checkbox" name="category" value="Hair & Makeup"> Hair &amp; Makeup</label>
          <label><input type="checkbox" name="category" value="Photography"> Photography</label>
          <label><input type="checkbox" name="category" value="Videography"> Videography</label>
          <label><input type="checkbox" name="category" value="Florist"> Florist</label>
          <label><input type="checkbox" name="category" value="DJ"> DJ</label>
          <label><input type="checkbox" name="category" value="Music"> Music</label>
          <label><input type="checkbox" name="category" value="Celebrant"> Celebrant</label>
          <label><input type="checkbox" name="category" value="Cake"> Cake</label>
          <label><input type="checkbox" name="category" value="Styling & Décor"> Styling &amp; Décor</label>
          <label><input type="checkbox" name="category" value="Wedding Cars"> Wedding Cars</label>
          <label><input type="checkbox" name="category" value="Content Creator"> Content Creator</label>
          <label><input type="checkbox" name="category" value="Wedding Planner"> Wedding Planner</label>
        </div>
      </div>
      <!-- Changed from a plain link to a real submit button, so we can
           run our own code first (save the data) before moving pages. -->
      <button type="submit" class="btn primary full">Continue</button>
    </form>
  </div>

  <!-- ============================================
       JAVASCRIPT: runs when the form is submitted.
       1. Stops the browser's default "reload the page" behaviour
       2. Reads every field's current value
       3. Collects all the CHECKED checkboxes into a list
       4. Saves everything as one new row, tagged with the logged-in
          user's real account id (not a localStorage guess)
       5. Sends the person on to the supplier list
       ============================================ -->
  <script>
    // AUTH GUARD: this page requires a real login. If nobody's
    // signed in, send them to login.html before they ever see the form.
    var currentUser = null;
    (async function () {
      var userResult = await supabaseClient.auth.getUser();
      if (!userResult.data.user) {
        window.location.href = 'login.html';
        return;
      }
      currentUser = userResult.data.user;
      document.body.style.visibility = 'visible';
    })();

    document.getElementById('weddingForm').addEventListener('submit', async function (e) {
      e.preventDefault(); // stop the form from doing a normal page reload

      // Find every checked checkbox named "category" and grab its value
      var selectedCategories = [];
      document.querySelectorAll('input[name="category"]:checked').forEach(function (box) {
        selectedCategories.push(box.value);
      });

      // Insert one new row into the wedding_profiles table, tagged
      // with user_id so it's THIS account's row — RLS (set up in
      // Supabase) enforces that only this same account (or an admin)
      // can ever read or edit it back.
      var result = await supabaseClient
        .from('wedding_profiles')
        .insert({
          user_id: currentUser.id,
          wedding_date: document.getElementById('weddingDate').value,
          location: document.getElementById('weddingLocation').value,
          guests: document.getElementById('guestCount').value,
          budget: document.getElementById('weddingBudget').value,
          categories: selectedCategories.join(',') // stored as one text field, comma-separated
        })
        .select()
        .single();

      if (result.error) {
        // If something's misconfigured (e.g. the RLS policies from
        // earlier), this shows up here instead of failing silently.
        alert('Something went wrong saving your details: ' + result.error.message);
        return;
      }

      // Now move on to the supplier list page
      window.location.href = 'supplier-list.html';
    });
  </script>

  <footer>
    Vowza — Less emailing. More celebrating.
  </footer>

</body>
</html>
