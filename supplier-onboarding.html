<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supplier Onboarding — Vowza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site">
    <div class="wrap" style="justify-content:center;">
      <a class="wordmark" href="index.html">Vowza</a>
    </div>
  </header>

  <section class="page-head wrap" style="text-align:center;">
    <h1>Create your business profile</h1>
    <p>Tell us a bit about your business to get started.</p>
  </section>

  <div class="wrap" style="padding-bottom:60px;">
    <form class="form-card">
      <div class="field"><label>Business name</label><input type="text" placeholder="e.g. Jane Photography"></div>
      <div class="field"><label>Contact name</label><input type="text" placeholder="Your full name"></div>
      <div class="field"><label>Email</label><input type="email" placeholder="you@business.com"></div>
      <div class="field"><label>Phone</label><input type="text" placeholder="0400 000 000"></div>
      <div class="field">
        <label>Category</label>
        <select>
          <option>Photography</option>
          <option>Videography</option>
          <option>Florist</option>
          <option>DJ / Music</option>
          <option>Hair &amp; Makeup</option>
          <option>Celebrant</option>
          <option>Cake</option>
          <option>Styling &amp; Décor</option>
          <option>Wedding Cars</option>
        </select>
      </div>
      <div class="field"><label>Location</label><input type="text" placeholder="e.g. Melbourne, VIC"></div>
      <div class="field"><label>Website</label><input type="text" placeholder="https://"></div>
      <div class="field"><label>Instagram</label><input type="text" placeholder="@yourbusiness"></div>
      <div class="field"><label>Travel radius</label><input type="text" placeholder="e.g. 100km"></div>
      <a class="btn primary full" href="supplier-profile-creation.html">Continue</a>
    </form>
  </div>

  <footer>
    Vowza — Less emailing. More celebrating.
  </footer>

</body>
</html>
