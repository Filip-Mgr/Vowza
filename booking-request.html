<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Request to Book — Vowza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site">
    <div class="wrap">
      <a class="wordmark" href="index.html">Vowza</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="supplier-list.html" class="active">Discover</a>
        <a href="my-wedding.html">My Wedding</a>
        <a href="shortlist.html">Saved</a>
        <a href="couple-profile.html">Profile</a>
      </nav>
    </div>
  </header>

  <section class="page-head wrap" style="text-align:center;">
    <h1>Request to Book</h1>
    <p>Jane Photography &mdash; Premium Package</p>
  </section>

  <div class="wrap" style="padding-bottom:60px;">
    <form class="form-card">
      <div class="field">
        <label>Wedding date</label>
        <input type="text" value="14 February 2027" readonly>
      </div>
      <div class="field">
        <label>Wedding location</label>
        <input type="text" value="Melbourne, VIC">
      </div>
      <div class="field">
        <label>Supplier / package selected</label>
        <input type="text" value="Jane Photography &mdash; Premium Package ($2,500)" readonly>
      </div>
      <div class="field">
        <label>Number of guests</label>
        <input type="number" value="90">
      </div>
      <div class="field">
        <label>Preferred time</label>
        <input type="text" placeholder="e.g. Ceremony at 3pm">
      </div>
      <div class="field">
        <label>Additional message</label>
        <textarea placeholder="Anything Jane should know about your day?"></textarea>
      </div>
      <a class="btn primary full" href="booking-status.html">Send Booking Request</a>
    </form>
  </div>

  <footer>
    Vowza — Less emailing. More celebrating.
  </footer>

</body>
</html>
