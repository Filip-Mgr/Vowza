<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile — Vowza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site">
    <div class="wrap">
      <a class="wordmark" href="index.html">Vowza</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="supplier-list.html">Discover</a>
        <a href="my-wedding.html">My Wedding</a>
        <a href="shortlist.html">Saved</a>
        <a href="couple-profile.html" class="active">Profile</a>
      </nav>
    </div>
  </header>

  <section class="page-head wrap">
    <h1>My Profile</h1>
  </section>

  <div class="wrap" style="padding-bottom:60px;">
    <form class="form-card" style="max-width:640px;" id="profileForm">
      <div class="field"><label>Name</label><input type="text" id="coupleName" value="Sasha &amp; Filip"></div>
      <div class="field"><label>Email</label><input type="email" id="coupleEmail" value="sasha.filip@email.com"></div>
      <div class="field"><label>Phone</label><input type="text" id="couplePhone" value="0400 000 000"></div>
      <div class="field"><label>Wedding date</label><input type="date" id="profileDate"></div>
      <div class="field"><label>Wedding location</label><input type="text" id="profileLocation" value="Melbourne, VIC"></div>
      <div class="field"><label>Guest numbers</label><input type="text" id="profileGuests" value="90"></div>
      <div class="field"><label>Budget</label><input type="text" id="profileBudget" value="$35,000"></div>
      <button type="submit" class="btn primary full">Save Changes</button>
      <p id="savedMessage" style="text-align:center; color:var(--evergreen); font-size:13px; margin-top:12px; display:none;">Saved!</p>
    </form>
  </div>

  <footer>
    Vowza — Less emailing. More celebrating.
  </footer>

  <script>
    // On page load: if a wedding profile was saved earlier (from
    // wedding-setup.html), pre-fill this form with it instead of
    // showing generic placeholder values.
    var saved = localStorage.getItem('vowzaWeddingProfile');
    if (saved) {
      var profile = JSON.parse(saved);
      if (profile.date) document.getElementById('profileDate').value = profile.date;
      if (profile.location) document.getElementById('profileLocation').value = profile.location;
      if (profile.guests) document.getElementById('profileGuests').value = profile.guests;
      if (profile.budget) document.getElementById('profileBudget').value = profile.budget;
    }

    // On save: write the (possibly edited) values back to the same
    // localStorage key, so every other page stays in sync with any
    // changes made here.
    document.getElementById('profileForm').addEventListener('submit', function (e) {
      e.preventDefault();

      var existing = JSON.parse(localStorage.getItem('vowzaWeddingProfile') || '{}');
      existing.date = document.getElementById('profileDate').value;
      existing.location = document.getElementById('profileLocation').value;
      existing.guests = document.getElementById('profileGuests').value;
      existing.budget = document.getElementById('profileBudget').value;

      localStorage.setItem('vowzaWeddingProfile', JSON.stringify(existing));

      document.getElementById('savedMessage').style.display = 'block';
    });
  </script>

</body>
</html>
