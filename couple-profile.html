<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile — Vowza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
</head>
<body style="visibility:hidden;">
  <header class="site">
    <div class="wrap">
      <a class="wordmark" href="index.html">Vowza</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="supplier-list.html">Discover</a>
        <a href="my-wedding.html">My Wedding</a>
        <a href="shortlist.html">Saved</a>
        <a href="couple-profile.html" class="active">Profile</a>
        <a href="#" id="logoutLink">Log Out</a>
      </nav>
    </div>
  </header>

  <section class="page-head wrap">
    <h1>My Profile</h1>
  </section>

  <div class="wrap" style="padding-bottom:60px;">
    <form class="form-card" style="max-width:640px;" id="profileForm">
      <div class="field"><label>Name</label><input type="text" id="coupleName" placeholder="e.g. Sasha &amp; Filip"></div>
      <div class="field"><label>Email</label><input type="email" id="coupleEmail" readonly style="opacity:0.7;"></div>
      <div class="field"><label>Phone</label><input type="text" id="couplePhone" placeholder="e.g. 0400 000 000"></div>
      <div class="field"><label>Wedding date</label><input type="date" id="profileDate"></div>
      <div class="field"><label>Wedding location</label><input type="text" id="profileLocation" value="Melbourne, VIC"></div>
      <div class="field"><label>Guest numbers</label><input type="text" id="profileGuests" value="90"></div>
      <div class="field"><label>Budget</label><input type="text" id="profileBudget" value="$35,000"></div>
      <button type="submit" class="btn primary full">Save Changes</button>
      <p id="savedMessage" style="text-align:center; color:var(--evergreen); font-size:13px; margin-top:12px; display:none;">Saved!</p>
    </form>
  </div>

  <footer>
    Vowza — Less emailing. More celebrating.
  </footer>

  <script>
    var currentUser = null;

    // AUTH GUARD + pre-fill: require login, then load whatever
    // wedding_profiles row belongs to this account (if any yet).
    (async function () {
      var userResult = await supabaseClient.auth.getUser();
      if (!userResult.data.user) {
        window.location.href = 'login.html';
        return;
      }
      currentUser = userResult.data.user;
      document.getElementById('coupleEmail').value = currentUser.email;

      var result = await supabaseClient
        .from('wedding_profiles')
        .select('*')
        .eq('user_id', currentUser.id)
        .maybeSingle(); // no row yet is fine — not an error

      document.body.style.visibility = 'visible';
      if (result.error || !result.data) return;
      var profile = result.data;

      if (profile.couple_name) document.getElementById('coupleName').value = profile.couple_name;
      if (profile.phone) document.getElementById('couplePhone').value = profile.phone;
      if (profile.wedding_date) document.getElementById('profileDate').value = profile.wedding_date;
      if (profile.location) document.getElementById('profileLocation').value = profile.location;
      if (profile.guests) document.getElementById('profileGuests').value = profile.guests;
      if (profile.budget) document.getElementById('profileBudget').value = profile.budget;
    })();

    // On save: update the existing row for this account if one
    // exists, otherwise create it (covers someone reaching this page
    // before ever completing wedding-setup.html).
    document.getElementById('profileForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      var fields = {
        couple_name: document.getElementById('coupleName').value,
        phone: document.getElementById('couplePhone').value,
        wedding_date: document.getElementById('profileDate').value,
        location: document.getElementById('profileLocation').value,
        guests: document.getElementById('profileGuests').value,
        budget: document.getElementById('profileBudget').value
      };

      // Try updating first — .select() makes it hand back the updated
      // row(s) so we can tell whether anything actually existed to update.
      var updateResult = await supabaseClient
        .from('wedding_profiles')
        .update(fields)
        .eq('user_id', currentUser.id)
        .select();

      var result;
      if (!updateResult.error && updateResult.data.length === 0) {
        // Nothing existed for this account yet — create it instead
        fields.user_id = currentUser.id;
        fields.email = currentUser.email;
        result = await supabaseClient.from('wedding_profiles').insert(fields);
      } else {
        result = updateResult;
      }

      if (result.error) {
        alert('Something went wrong saving your details: ' + result.error.message);
        return;
      }

      document.getElementById('savedMessage').style.display = 'block';
    });

    document.getElementById('logoutLink').addEventListener('click', async function (e) {
      e.preventDefault();
      await supabaseClient.auth.signOut();
      window.location.href = 'index.html';
    });
  </script>

</body>
</html>
